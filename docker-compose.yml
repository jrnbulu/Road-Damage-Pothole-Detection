# docker compose up --build   -> API on :8000, Streamlit on :8501
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./models:/app/models:ro"]
  app:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./models:/app/models:ro"]
    healthcheck:
      disable: true
